              const u = (await github.graphql("query($login: String!) { user(login: $login) { name login followers { totalCount } pullRequests { totalCount } merged: pullRequests(states: MERGED) { totalCount } issues { totalCount } repositoryDiscussions { totalCount } repositoryDiscussionComments(onlyAnswers: true) { totalCount } repositoriesContributedTo(contributionTypes: [COMMIT, ISSUE, PULL_REQUEST, REPOSITORY]) { totalCount } repositories(ownerAffiliations: OWNER, isFork: false, privacy: PUBLIC, first: 100, orderBy: { field: STARGAZERS, direction: DESC }) { totalCount nodes { stargazerCount forkCount languages(first: 10, orderBy: { field: SIZE, direction: DESC }) { edges { size node { name color } } } } } contributionsCollection { totalCommitContributions totalPullRequestReviewContributions contributionCalendar { totalContributions weeks { contributionDays { date contributionCount } } } } } }", { login })).user, cc = u.contributionsCollection, langs = {}
              u.repositories.nodes.forEach((n) => n.languages.edges.forEach((e) => { const l = langs[e.node.name] || (langs[e.node.name] = { name: e.node.name, color: e.node.color, size: 0 }); l.size += e.size }))
              d = { name: u.name, login: u.login, followers: u.followers.totalCount, repos: u.repositories.totalCount, stars: u.repositories.nodes.reduce((s, n) => s + n.stargazerCount, 0), forks: u.repositories.nodes.reduce((s, n) => s + n.forkCount, 0),
                commits: cc.totalCommitContributions, prs: u.pullRequests.totalCount, prs_merged: u.merged.totalCount, issues: u.issues.totalCount, reviews: cc.totalPullRequestReviewContributions, contribs: u.repositoriesContributedTo.totalCount,
                discussions_started: u.repositoryDiscussions.totalCount, discussions_answered: u.repositoryDiscussionComments.totalCount, contributions: cc.contributionCalendar.totalContributions,
                langs: Object.values(langs).sort((a, b) => b.size - a.size), days: cc.contributionCalendar.weeks.flatMap((w) => w.contributionDays.map((x) => ({ date: x.date, count: x.contributionCount }))), today: new Date().toISOString().slice(0, 10) }
              if (CARDS.some((c) => c.kind === 'stats' && c.opts.allCommits)) d.commitsAll = (await github.rest.search.commits({ q: 'author:' + login, per_page: 1 })).data.total_count
            }
            async function repo(spec) {
              const [o, n] = spec.split('/')
              const x = (await github.graphql('query($o: String!, $n: String!) { repository(owner: $o, name: $n) { name owner { login } description stargazerCount forkCount isArchived primaryLanguage { name color } } }', { o, n })).repository
              return { owner: x.owner.login, name: x.name, description: x.description, stars: x.stargazerCount, forks: x.forkCount, archived: x.isArchived, language: x.primaryLanguage && x.primaryLanguage.name, color: x.primaryLanguage && x.primaryLanguage.color }
            }
            async function people(spec, max) {
              const [owner, repo] = spec.split('/')
              const list = (await github.rest.repos.listContributors({ owner, repo, per_page: Math.min(100, max) })).data.filter((x) => x.type !== 'Bot').slice(0, max)
              return Promise.all(list.map(async (x) => { let avatar = ''; try { const r = await fetch(x.avatar_url + (x.avatar_url.includes('?') ? '&' : '?') + 's=128'); if (r.ok) avatar = 'data:' + (r.headers.get('content-type') || 'image/png') + ';base64,' + Buffer.from(await r.arrayBuffer()).toString('base64') } catch (_) {} return { login: x.login, avatar } }))
            }
            async function waka(user) {
              const key = process.env.WAKATIME_API_KEY
              const url = 'https://wakatime.com/api/v1/users/' + (key ? 'current' : encodeURIComponent(user || login)) + '/stats/last_7_days'
              try { const r = await fetch(url, { headers: key ? { Authorization: 'Basic ' + Buffer.from(key).toString('base64') } : {} }); if (!r.ok) return {}; const x = (await r.json()).data || {}
                return { total: x.human_readable_total, average: x.human_readable_daily_average, languages: (x.languages || []).map((l) => ({ name: l.name, text: l.text, percent: l.percent })) } } catch (_) { return {} }
            }
            async function gist(id) {
              const g = (await github.rest.gists.get({ gist_id: id })).data, f = Object.values(g.files || {})[0] || {}
              return { owner: g.owner && g.owner.login, name: f.filename || id, description: g.description, stars: 0, forks: (g.forks || []).length, language: f.language, color: '' }
            }
            fs.mkdirSync('profile-assets', { recursive: true })
            const keep = new Set()
            for (const c of CARDS) {
              let data
              try { data = c.kind === 'repo' ? await repo(c.opts.repo) : c.kind === 'gist' ? await gist(c.opts.id) : c.kind === 'contributors' ? await people(c.opts.repo, c.opts.max) : c.kind === 'wakatime' ? await waka(c.opts.user) : d }
              catch (e) { console.log('::warning::' + c.files[0].file + ' kept as it was: ' + String(e.message || e).split('\n')[0]); c.files.forEach((f) => keep.add(f.file)); continue }
              for (const f of c.files) { fs.writeFileSync(f.file, C[c.kind === 'gist' ? 'repo' : c.kind](data, Object.assign({ gist: c.kind === 'gist' }, c.opts), C.palette(f.colors, c.hideBorder))); keep.add(f.file) }
            }
            for (const f of fs.readdirSync('profile-assets')) if (/^card-.*\.svg$/.test(f) && !keep.has('profile-assets/' + f)) fs.unlinkSync('profile-assets/' + f)
      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-assets README.md
          if git commit -m "Update profile"; then git push; fi
