name: Your profile, kept up to date
on:
  schedule:
    - cron: '20 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROFILE_TOKEN || github.token }}
          script: |
            const fs = require('fs')
            const C = (function makeCards() {
                const FONT = "-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif"
                const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
                const num = (n) => { n = +n || 0; return n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : n >= 1e4 ? (n / 1000).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, '') + 'k' : n.toLocaleString('en-US') }
                const r1 = (n) => Math.round(n * 10) / 10
                const mix = (a, b, t) => '#' + [0, 2, 4].map((i) => Math.round(parseInt(a.slice(i, i + 2), 16) * (1 - t) + parseInt(b.slice(i, i + 2), 16) * t).toString(16).padStart(2, '0')).join('')
                // Colours from a theme: { bg, fg, line, point } as hex without #.
                function palette(t, hideBorder) {
                  const lum = (h) => [0, 2, 4].reduce((a, i, k) => a + parseInt(h.slice(i, i + 2), 16) * [0.2126, 0.7152, 0.0722][k], 0) / 255
                  return { dark: lum(t.bg) < 0.4, bg: '#' + t.bg, fg: '#' + t.fg, accent: '#' + t.line, point: '#' + t.point, muted: mix(t.fg, t.bg, 0.38), faint: mix(t.fg, t.bg, 0.82), track: mix(t.fg, t.bg, 0.9), border: hideBorder ? 'none' : mix(t.fg, t.bg, 0.78) }
                }
                function frame(w, h, p, title, body, label) {
                  return '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + esc(label || title) + '"><title>' + esc(label || title) + '</title>' +
                    '<rect x="0.5" y="0.5" width="' + (w - 1) + '" height="' + (h - 1) + '" rx="8" fill="' + p.bg + '" stroke="' + p.border + '"/>' +
                    '<g font-family="' + FONT + '">' + (title ? '<text x="24" y="38" font-size="17" font-weight="600" fill="' + p.accent + '">' + esc(title) + '</text>' : '') + body + '</g></svg>'
                }
                // Small line icons (24 px grid, stroked) for the stats rows and trophies.
                const ICON = {
                  stars: 'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z',
                  commits: 'M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM3 12h6M15 12h6',
                  prs: 'M6 4a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM6 16a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM18 16a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM6 8v8M18 16V9a3 3 0 0 0-3-3h-4M13 4l-2 2 2 2',
                  issues: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 11a1 1 0 1 0 0 2 1 1 0 0 0 0-2z',
                  contribs: 'M4 6h16M4 12h10M4 18h7M17 15l2 2 3-4',
                  prs_merged: 'M6 4a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM6 16a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM18 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM6 8v8M6 8c0 4 4 6 10 6',
                  prs_merged_percentage: 'M5 19L19 5M7 5a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM17 15a2 2 0 1 0 0 4 2 2 0 0 0 0-4z',
                  reviews: 'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z',
                  discussions_started: 'M4 5h12v8H8l-4 3zM16 9h4v8l-3-2h-6v-2',
                  discussions_answered: 'M4 5h16v10H9l-5 4zM9 10l2 2 4-4',
                  followers: 'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2M16 3.1a4 4 0 0 1 0 7.8M22 21v-2a5 5 0 0 0-4-4.9',
                  repos: 'M4 4h12a2 2 0 0 1 2 2v14H6a2 2 0 0 1-2-2zM4 18a2 2 0 0 1 2-2h12',
                  forks: 'M7 3a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM17 3a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM12 17a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM7 7v2a3 3 0 0 0 3 3h4a3 3 0 0 0 3-3V7M12 12v5',
                }
                const icon = (k, x, y, s, c) => '<path transform="translate(' + x + ' ' + y + ') scale(' + r1(s / 24 * 100) / 100 + ')" d="' + ICON[k] + '" fill="none" stroke="' + c + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'

                const ROWS = { stars: 'Stars earned', commits: 'Commits', prs: 'Pull requests', issues: 'Issues', contribs: 'Contributed to', prs_merged: 'Pull requests merged', prs_merged_percentage: 'Merged PR rate', reviews: 'Code reviews', discussions_started: 'Discussions started', discussions_answered: 'Discussions answered' }
                // A level from 1 to 10 out of a weighted, log-scaled score of the year's work.
                function level(d) {
                  const s = Math.log10(1 + (d.commits || 0)) * 2 + Math.log10(1 + (d.prs || 0)) * 2.4 + Math.log10(1 + (d.stars || 0)) * 2.2 + Math.log10(1 + (d.followers || 0)) * 1.6 + Math.log10(1 + (d.reviews || 0)) * 1.2 + Math.log10(1 + (d.issues || 0))
                  return Math.max(1, Math.min(10, Math.round(s * 0.55)))
                }
                function stats(d, o, p) {
                  const rows = (o.rows && o.rows.length ? o.rows : ['stars', 'commits', 'prs', 'issues', 'contribs']).filter((k) => ROWS[k])
                  const val = (k) => (k === 'prs_merged_percentage' ? (d.prs ? Math.round((d.prs_merged || 0) / d.prs * 1000) / 10 : 0) + '%' : num(k === 'commits' && o.allCommits ? d.commitsAll || d.commits : d[k]))
                  const label = (k) => ROWS[k] + (k === 'commits' ? (o.allCommits ? ' (all time)' : ' (this year)') : k === 'reviews' ? ' (this year)' : '')
                  const H = Math.max(150, 62 + rows.length * 26 + 18), W = o.hideRank ? 400 : 480
                  const body = rows.map((k, i) => { const y = 74 + i * 26; return (o.icons ? icon(k, 24, y - 13, 16, p.accent) : '') + '<text x="' + (o.icons ? 48 : 24) + '" y="' + y + '" font-size="14" fill="' + p.fg + '">' + esc(label(k)) + '</text><text x="' + (o.hideRank ? 376 : 330) + '" y="' + y + '" font-size="14" font-weight="600" text-anchor="end" fill="' + p.fg + '">' + esc(val(k)) + '</text>' }).join('')
                  let ring = ''
                  if (!o.hideRank) {
                    const lv = level(d), cx = 412, cy = H / 2 + 8, R = 38, C = 2 * Math.PI * R
                    ring = '<circle cx="' + cx + '" cy="' + cy + '" r="' + R + '" fill="none" stroke="' + p.track + '" stroke-width="7"/>' +
                      '<circle cx="' + cx + '" cy="' + cy + '" r="' + R + '" fill="none" stroke="' + p.accent + '" stroke-width="7" stroke-linecap="round" stroke-dasharray="' + r1(C * lv / 10) + ' ' + r1(C) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')"/>' +
                      '<text x="' + cx + '" y="' + (cy + 4) + '" font-size="26" font-weight="700" text-anchor="middle" fill="' + p.fg + '">' + lv + '</text>' +
                      '<text x="' + cx + '" y="' + (cy + 22) + '" font-size="11" text-anchor="middle" fill="' + p.muted + '">level</text>'
                  }
                  return frame(W, H, p, (d.name || d.login) + '’s GitHub stats', body + ring)
                }
                function langs(d, o, p) {
                  const ls = (d.langs || []).slice(0, Math.max(1, Math.min(20, o.count || 6)))
                  const total = ls.reduce((n, l) => n + l.size, 0) || 1
                  const pct = (l) => (l.size / total * 100).toFixed(1) + '%'
                  const col = (l) => l.color || p.muted
                  const layout = o.layout || 'compact'
                  const title = 'Most used languages'
                  if (layout === 'donut' || layout === 'pie' || layout === 'donut-vertical') {
                    const vert = layout === 'donut-vertical'
                    const R = 60, r = layout === 'pie' ? 0 : 36
                    const W = vert ? 340 : 400, cx = vert ? W / 2 : 90 + 4, cy = vert ? 140 : 62 + Math.max(R, ls.length * 11)
                    let a = -Math.PI / 2
                    const arcs = ls.map((l) => {
                      const s = Math.max(0.0001, l.size / total * 2 * Math.PI), a2 = a + s, big = s > Math.PI ? 1 : 0
                      const pt = (rad, ang) => r1(cx + rad * Math.cos(ang)) + ' ' + r1(cy + rad * Math.sin(ang))
                      const path = ls.length === 1 ? '<circle cx="' + cx + '" cy="' + cy + '" r="' + R + '" fill="' + col(l) + '"/>' : '<path d="M' + pt(R, a) + 'A' + R + ' ' + R + ' 0 ' + big + ' 1 ' + pt(R, a2) + (r ? 'L' + pt(r, a2) + 'A' + r + ' ' + r + ' 0 ' + big + ' 0 ' + pt(r, a) : 'L' + cx + ' ' + cy) + 'Z" fill="' + col(l) + '"/>'
                      a = a2
                      return path
                    }).join('') + (r && ls.length === 1 ? '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + p.bg + '"/>' : '')
                    const lx = vert ? 32 : 190, ly = vert ? 230 : 70
                    const list = ls.map((l, i) => { const x = vert ? lx + (i % 2) * 150 : lx, y = vert ? ly + Math.floor(i / 2) * 22 : ly + i * 22; return '<circle cx="' + (x + 5) + '" cy="' + (y - 4) + '" r="5" fill="' + col(l) + '"/><text x="' + (x + 16) + '" y="' + y + '" font-size="13" fill="' + p.fg + '">' + esc(l.name) + ' <tspan fill="' + p.muted + '">' + pct(l) + '</tspan></text>' }).join('')
                    const H = vert ? ly + Math.ceil(ls.length / 2) * 22 + 6 : Math.max(cy + R + 22, ly + ls.length * 22 + 6)
                    return frame(W, H, p, title, arcs + list)
                  }
                  if (layout === 'normal') {
                    const W = 340, H = 60 + ls.length * 40 + 6
                    return frame(W, H, p, title, ls.map((l, i) => { const y = 72 + i * 40; return '<text x="24" y="' + y + '" font-size="13" fill="' + p.fg + '">' + esc(l.name) + '</text><text x="316" y="' + y + '" font-size="12" text-anchor="end" fill="' + p.muted + '">' + pct(l) + '</text>' +
                      '<rect x="24" y="' + (y + 8) + '" width="292" height="8" rx="4" fill="' + p.track + '"/><rect x="24" y="' + (y + 8) + '" width="' + r1(Math.max(8, l.size / total * 292)) + '" height="8" rx="4" fill="' + col(l) + '"/>' }).join(''))
                  }
                  let x = 24
                  const bar = ls.map((l) => { const w = l.size / total * 292; const s = '<rect x="' + r1(x) + '" y="54" width="' + r1(Math.max(w, 1)) + '" height="10" fill="' + col(l) + '"/>'; x += w; return s }).join('')
                  const rows = Math.ceil(ls.length / 2)
                  const list = ls.map((l, i) => { const cx = i % 2 ? 180 : 24; const cy = 94 + Math.floor(i / 2) * 22; return '<circle cx="' + (cx + 5) + '" cy="' + (cy - 4) + '" r="5" fill="' + col(l) + '"/><text x="' + (cx + 16) + '" y="' + cy + '" font-size="13" fill="' + p.fg + '">' + esc(l.name) + ' <tspan fill="' + p.muted + '">' + pct(l) + '</tspan></text>' }).join('')
                  return frame(340, 78 + rows * 22 + 12, p, title, '<clipPath id="lb"><rect x="24" y="54" width="292" height="10" rx="5"/></clipPath><rect x="24" y="54" width="292" height="10" rx="5" fill="' + p.track + '"/><g clip-path="url(#lb)">' + bar + '</g>' + list)
                }
                // Current and longest streak, by day or by week. A day that is not over yet does not break a streak.
                function streaks(days, weekly, today) {
                  let list = days.slice().sort((a, b) => (a.date < b.date ? -1 : 1))
                  if (weekly) {
                    const wk = {}
                    list.forEach((x) => { const t = new Date(x.date + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() - t.getUTCDay()); const k = t.toISOString().slice(0, 10); wk[k] = (wk[k] || 0) + x.count })
                    list = Object.keys(wk).sort().map((k) => ({ date: k, count: wk[k] }))
                  }
                  const last = list.length ? list[list.length - 1].date : ''
                  const now = weekly ? last : today || last
                  let longest = 0, run = 0, cur = 0
                  list.forEach((x) => { run = x.count > 0 ? run + 1 : 0; if (run > longest) longest = run })
                  for (let i = list.length - 1; i >= 0; i--) {
                    if (list[i].count > 0) cur++
                    else if (list[i].date === now && cur === 0) continue
                    else break
                  }
                  return { cur, longest }
                }
                function streak(d, o, p) {
                  const weekly = o.mode === 'weekly'
                  const s = streaks(d.days || [], weekly, d.today)
                  const unit = (n) => (weekly ? (n === 1 ? 'week' : 'weeks') : n === 1 ? 'day' : 'days')
                  const cols = [[num(d.contributions), 'Contributions', 'past year'], [String(s.cur), 'Current streak', unit(s.cur)], [String(s.longest), 'Longest streak', unit(s.longest) + ' this year']]
                  return frame(480, 168, p, '', cols.map((c, i) => {
                    const cx = 80 + i * 160
                    return (i === 1 ? '<circle cx="' + cx + '" cy="62" r="34" fill="none" stroke="' + p.accent + '" stroke-width="5"/>' : '') +
                      '<text x="' + cx + '" y="' + (i === 1 ? 72 : 70) + '" font-size="28" font-weight="700" text-anchor="middle" fill="' + (i === 1 ? p.accent : p.fg) + '">' + c[0] + '</text>' +
                      '<text x="' + cx + '" y="124" font-size="14" font-weight="600" text-anchor="middle" fill="' + p.fg + '">' + c[1] + '</text>' +
                      '<text x="' + cx + '" y="144" font-size="12" text-anchor="middle" fill="' + p.muted + '">' + c[2] + '</text>'
                  }).join('') + '<line x1="160" y1="30" x2="160" y2="146" stroke="' + p.faint + '"/><line x1="320" y1="30" x2="320" y2="146" stroke="' + p.faint + '"/>', 'Contribution streak: ' + s.cur + ' current, ' + s.longest + ' longest')
                }
                // Trophies: a tier for each count, from the first step to the top one.
                const TROPHY = [['stars', 'Stars', [1, 10, 50, 100, 500, 1000, 5000]], ['commits', 'Commits', [10, 50, 100, 500, 1000, 2000, 5000]], ['followers', 'Followers', [1, 10, 50, 100, 500, 1000, 5000]],
                  ['prs', 'Pull requests', [1, 10, 25, 50, 100, 500, 1000]], ['issues', 'Issues', [1, 10, 25, 50, 100, 500, 1000]], ['repos', 'Repositories', [1, 5, 10, 25, 50, 100, 200]], ['reviews', 'Code reviews', [1, 10, 25, 50, 100, 250, 500]]]
                const TIERS = ['First', 'Bronze', 'Silver', 'Gold', 'Platinum', 'Diamond', 'Legend']
                function trophies(d, o, p) {
                  const all = TROPHY.map(([k, name, steps]) => { const n = d[k] || 0; let t = -1; steps.forEach((s, i) => { if (n >= s) t = i }); return { k, name, n, t } })
                  const list = o.earnedOnly ? all.filter((x) => x.t >= 0) : all
                  const per = Math.max(1, Math.min(list.length || 1, o.column || 6)), rows = Math.max(1, Math.ceil(list.length / per))
                  const CW = 120, CH = 128, G = 8
                  const W = per * CW + (per - 1) * G, H = rows * CH + (rows - 1) * G
                  const cups = list.map((x, i) => {
                    const X = (i % per) * (CW + G), Y = Math.floor(i / per) * (CH + G)
                    const on = x.t >= 0, c = on ? p.accent : p.faint
                    const back = o.noBg ? '' : '<rect x="' + (X + 0.5) + '" y="' + (Y + 0.5) + '" width="' + (CW - 1) + '" height="' + (CH - 1) + '" rx="8" fill="' + p.bg + '"' + (o.noFrame ? '' : ' stroke="' + (p.border === 'none' ? p.faint : p.border) + '"') + '/>'
                    const cx = X + CW / 2
                    return back + '<g transform="translate(' + (cx - 20) + ' ' + (Y + 16) + ')" fill="none" stroke="' + c + '" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2h20v12a10 10 0 0 1-20 0zM10 6H4a6 6 0 0 0 6 8M30 6h6a6 6 0 0 1-6 8M20 24v6M12 34h16M14 30h12"/></g>' +
                      (on ? '<text x="' + cx + '" y="' + (Y + 34) + '" font-size="10" font-weight="700" text-anchor="middle" fill="' + c + '">' + (x.t + 1) + '</text>' : '') +
                      '<text x="' + cx + '" y="' + (Y + 78) + '" font-size="13" font-weight="600" text-anchor="middle" fill="' + p.fg + '">' + esc(x.name) + '</text>' +
                      '<text x="' + cx + '" y="' + (Y + 96) + '" font-size="12" text-anchor="middle" fill="' + p.muted + '">' + num(x.n) + '</text>' +
                      '<text x="' + cx + '" y="' + (Y + 114) + '" font-size="11" text-anchor="middle" fill="' + (on ? p.accent : p.muted) + '">' + (on ? TIERS[x.t] : 'Not yet') + '</text>'
                  }).join('')
                  return '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Trophies"><title>Trophies</title><g font-family="' + FONT + '">' + cups + '</g></svg>'
                }
                // The last 31 days of contributions as a line.
                function activity(d, o, p) {
                  const days = (d.days || []).slice().sort((a, b) => (a.date < b.date ? -1 : 1)).slice(-31)
                  const W = 860, H = 300, L = 56, R = 24, T = 64, B = 52
                  const max = Math.max(4, ...days.map((x) => x.count))
                  const top = Math.ceil(max / 4) * 4
                  const X = (i) => r1(L + i * (W - L - R) / Math.max(1, days.length - 1)), Y = (v) => r1(T + (1 - v / top) * (H - T - B))
                  const pts = days.map((x, i) => X(i) + ',' + Y(x.count))
                  const grid = [0, 1, 2, 3, 4].map((k) => { const v = top * k / 4, y = Y(v); return '<line x1="' + L + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y + '" stroke="' + p.track + '"/><text x="' + (L - 10) + '" y="' + (y + 4) + '" font-size="11" text-anchor="end" fill="' + p.muted + '">' + v + '</text>' }).join('')
                  const ticks = days.map((x, i) => (i % 5 === 0 || i === days.length - 1 ? '<text x="' + X(i) + '" y="' + (H - B + 22) + '" font-size="11" text-anchor="middle" fill="' + p.muted + '">' + +x.date.slice(8, 10) + '</text>' : '')).join('')
                  const area = o.area && days.length > 1 ? '<path d="M' + X(0) + ' ' + Y(0) + 'L' + pts.join('L') + 'L' + X(days.length - 1) + ' ' + Y(0) + 'Z" fill="' + p.accent + '" opacity="0.18"/>' : ''
                  const line = days.length > 1 ? '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + p.accent + '" stroke-width="2.5" stroke-linejoin="round"/>' : ''
                  const dots = days.map((x, i) => '<circle cx="' + X(i) + '" cy="' + Y(x.count) + '" r="3.5" fill="' + p.point + '"/>').join('')
                  return frame(W, H, p, o.title || (d.name || d.login) + '’s contributions, last 31 days', grid + ticks + area + line + dots + '<text x="' + ((W + L - R) / 2) + '" y="' + (H - 8) + '" font-size="11" text-anchor="middle" fill="' + p.muted + '">Days</text>')
                }
                // A pinned repository or a gist: name, description, language, stars and forks.
                function wrap(text, max) { const out = []; let cur = ''; String(text || '').split(/\s+/).filter(Boolean).forEach((w) => { if ((cur + ' ' + w).trim().length > max) { if (cur) out.push(cur); cur = w } else cur = (cur + ' ' + w).trim() }); if (cur) out.push(cur); return out }
                function repo(r, o, p) {
                  const W = 400
                  const desc = wrap(r.description || 'No description.', 56).slice(0, 3)
                  const H = 112 + desc.length * 18
                  const name = (o.showOwner && r.owner ? r.owner + '/' : '') + (r.name || '')
                  const foot = H - 22
                  const lang = r.language ? '<circle cx="30" cy="' + (foot - 4) + '" r="6" fill="' + (r.color || p.muted) + '"/><text x="42" y="' + foot + '" font-size="12" fill="' + p.fg + '">' + esc(r.language) + '</text>' : ''
                  const lx = r.language ? 42 + r.language.length * 7.4 + 20 : 24
                  return frame(W, H, p, '', icon(o.gist ? 'issues' : 'repos', 24, 22, 18, p.muted) + '<text x="50" y="38" font-size="15" font-weight="600" fill="' + p.accent + '">' + esc(name) + '</text>' +
                    (r.archived ? '<text x="' + (W - 24) + '" y="38" font-size="11" text-anchor="end" fill="' + p.muted + '">Archived</text>' : '') +
                    desc.map((l, i) => '<text x="24" y="' + (68 + i * 18) + '" font-size="13" fill="' + p.muted + '">' + esc(l) + '</text>').join('') +
                    lang + icon('stars', lx, foot - 13, 16, p.muted) + '<text x="' + (lx + 20) + '" y="' + foot + '" font-size="12" fill="' + p.muted + '">' + num(r.stars) + '</text>' +
                    icon('forks', lx + 64, foot - 13, 16, p.muted) + '<text x="' + (lx + 84) + '" y="' + foot + '" font-size="12" fill="' + p.muted + '">' + num(r.forks) + '</text>', name + ': ' + (r.description || ''))
                }
                // Round avatars in a grid. people: [{ login, avatar }], avatar a data: URI or empty (initials instead).
                function contributors(people, o, p) {
                  const list = (people || []).slice(0, Math.max(1, o.max || 24))
                  const per = Math.max(1, Math.min(list.length || 1, o.columns || 12)), rows = Math.max(1, Math.ceil(list.length / per))
                  const S = 64, G = 8, W = per * S + (per - 1) * G, H = rows * S + (rows - 1) * G
                  const hue = (t) => { let h = 0; for (const c of String(t)) h = (h * 31 + c.charCodeAt(0)) % 360; return h }
                  const faces = list.map((x, i) => {
                    const X = (i % per) * (S + G), Y = Math.floor(i / per) * (S + G), id = 'a' + i
                    return '<clipPath id="' + id + '"><circle cx="' + (X + S / 2) + '" cy="' + (Y + S / 2) + '" r="' + S / 2 + '"/></clipPath>' +
                      (x.avatar ? '<image href="' + x.avatar + '" x="' + X + '" y="' + Y + '" width="' + S + '" height="' + S + '" clip-path="url(#' + id + ')"><title>' + esc(x.login) + '</title></image>'
